# All-in-one LiveKit + Egress container
# Giải quyết vấn đề network trên Windows Docker Desktop

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - E:/NCC/egress/minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - livekit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Tạo bucket tự động khi khởi động
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/livekit-recordings --ignore-existing;
      mc anonymous set download myminio/livekit-recordings;
      echo 'Bucket created successfully!';
      "
    networks:
      - livekit

  mongodb:
    image: mongo:7
    container_name: mezon-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: mezon_transcripts
    volumes:
      - E:/NCC/egress/mongodb_data:/data/db
    networks:
      - livekit
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "root",
          "-p",
          "rootpassword",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # webhook-handler:
  #   image: python:3.11-slim
  #   container_name: webhook-handler
  #   restart: unless-stopped
  #   working_dir: /app
  #   command: >
  #     sh -c "pip install --no-cache-dir -r requirements.txt && python webhook_server.py"
  #   volumes:
  #     - E:/NCC/egress/webhook_server.py:/app/webhook_server.py:ro
  #     - E:/NCC/egress/requirements.txt:/app/requirements.txt:ro
  #     # - E:/NCC/egress/recordings:/recordings
  #   ports:
  #     - "8000:8000"
  #   networks:
  #     - livekit

  livekit-allinone:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    container_name: livekit-allinone
    restart: unless-stopped
    depends_on:
      # - webhook-handler
      - minio-init
    ports:
      - "7880:7880"   # HTTP/WebSocket
      - "7881:7881"   # RTC TCP
      - "7882:7882/udp" # RTC UDP
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    shm_size: "2gb"
    volumes:
      # - E:/NCC/egress/recordings:/recordings
      - E:/NCC/egress/livekit.yaml:/etc/livekit/livekit.yaml:ro
    networks:
      - livekit

networks:
  livekit:
    driver: bridge
