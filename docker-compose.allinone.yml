# All-in-one LiveKit + Egress container
# Giải quyết vấn đề network trên Windows Docker Desktop

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - /home/nccsoft/projects/mezon-call-translation/demo-infra/minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - livekit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Tạo bucket tự động khi khởi động
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/livekit-recordings --ignore-existing;
      mc anonymous set download myminio/livekit-recordings;
      echo 'Bucket created successfully!';
      "
    networks:
      - livekit

  mongodb:
    image: mongo:7
    container_name: mezon-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: mezon_transcripts
    volumes:
      - /home/nccsoft/projects/mezon-call-translation/demo-infra/mongodb_data:/data/db
    networks:
      - livekit
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "root",
          "-p",
          "rootpassword",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  livekit-egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    restart: unless-stopped

    cap_add:
      - SYS_ADMIN

    environment:
      EGRESS_CONFIG_FILE: /out/egress.yaml

    volumes:
      - /home/nccsoft/projects/mezon-call-translation/demo-infra:/out
      - /dev/shm:/dev/shm

    command: ["egress"]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - livekit

networks:
  livekit:
    driver: bridge