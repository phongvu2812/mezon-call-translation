rtc:
  # TCP port for WebRTC/ICE over TCP
  tcp_port: 7881

  # Single UDP port mode (simpler for LAN/dev). If you need NAT traversal across the internet,
  # you may want a port range + TURN.
  udp_port: 7882

  # If you are recording locally on the same machine/LAN, this is usually fine.
  use_external_ip: false

